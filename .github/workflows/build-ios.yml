name: Build iOS Native App (Splitwise)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Build Web Application
        run: |
          cd client
          npm run build

      - name: Sync Capacitor iOS Platform
        run: |
          cd client
          npx cap sync ios

      - name: Build Xcode iOS App (Simulator / Unsigned Archive)
        run: |
          cd client/ios/App
          xcodebuild -project App.xcodeproj \
                     -scheme App \
                     -sdk iphonesimulator \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package iOS App Artifact
        run: |
          mkdir -p output
          cp -R client/ios/App/build/Build/Products/Release-iphonesimulator/App.app output/Splitwise.app
          cd output && zip -r Splitwise-iOS-Simulator.zip Splitwise.app

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Splitwise-iOS-App
          path: output/Splitwise-iOS-Simulator.zip
