name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Build Web Application
        run: |
          cd client
          npm run build

      - name: Sync Capacitor Android Platform
        run: |
          cd client
          npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x client/android/gradlew

      - name: Build Android Debug APK
        run: |
          cd client/android
          ./gradlew assembleDebug --no-daemon

      - name: Move APK to Output Location
        run: |
          mkdir -p builds/android
          cp client/android/app/build/outputs/apk/debug/app-debug.apk SplitWise.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SplitWise-Android-APK
          path: SplitWise.apk
